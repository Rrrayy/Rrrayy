<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rray — C++ Server-side and AI Agents">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E11D2E"/>
      <stop offset="32%"  stop-color="#96101F"/>
      <stop offset="62%"  stop-color="#3A0A0F"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF3B3B" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#C1121F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#C1121F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="scrim" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.34"/>
      <stop offset="70%"  stop-color="#000000" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- crimson-to-black field -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="150" fill="url(#sheen)"/>
  <ellipse cx="560" cy="130" rx="480" ry="200" fill="url(#orb)"/>
  <ellipse cx="600" cy="140" rx="470" ry="150" fill="url(#scrim)"/>

  <!-- fine grid / dot accents -->
  <g fill="#ffffff" opacity="0.09">
    <circle cx="80"  cy="60"  r="2.5"/><circle cx="140" cy="118" r="2"/><circle cx="196" cy="52" r="2"/>
    <circle cx="1024" cy="70" r="2.5"/><circle cx="1082" cy="126" r="2"/><circle cx="1136" cy="56" r="2"/>
    <circle cx="980" cy="170" r="2"/><circle cx="120" cy="180" r="2"/>
  </g>
  <g stroke="#FF6B6B" stroke-opacity="0.20" stroke-width="1.5" fill="none">
    <path d="M36 36 H170 V86 H250"/>
    <path d="M1164 36 H1046 V96 H966"/>
    <circle cx="250" cy="86" r="3"/>
    <circle cx="966" cy="96" r="3"/>
  </g>

  <!-- layered waves sinking into GitHub dark bg (#0d1117) -->
  <path d="M0 214 C 200 164, 380 246, 600 220 C 820 194, 1000 258, 1200 206 L1200 320 L0 320 Z"
        fill="#0d1117" opacity="0.35"/>
  <path d="M0 248 C 220 202, 420 274, 640 246 C 860 218, 1030 284, 1200 238 L1200 320 L0 320 Z"
        fill="#0d1117" opacity="0.70"/>
  <path d="M0 250 C 220 204, 420 276, 640 248 C 860 220, 1030 286, 1200 240"
        fill="none" stroke="#EF4444" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M0 282 C 240 244, 460 300, 680 278 C 900 256, 1060 306, 1200 272 L1200 320 L0 320 Z"
        fill="#0d1117"/>

  <!-- name -->
  <text x="600" y="144" text-anchor="middle"
        font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif"
        font-size="92" font-weight="800" fill="#ffffff" letter-spacing="4">Rray</text>

  <!-- subtitle -->
  <text x="600" y="188" text-anchor="middle"
        font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif"
        font-size="21" font-weight="500" fill="#FFF1F2" letter-spacing="5">C++ SERVER-SIDE · AI AGENT SYSTEMS</text>
</svg>
